name: Security DAST

on:
    workflow_dispatch:
        inputs:
            target_url:
                description: 'The URL of the application to scan'
                required: true
                default: 'http://my-application-url.com'

jobs:
    security-dast:
        runs-on: ubuntu-latest
        steps:
            - name: OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@v0.15.0
              with:
                target: ${{ inputs.target_url }}
                fail_action: true


