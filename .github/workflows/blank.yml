name: 04 - Using Actions with AWS

on:
  workflow_dispatch:

jobs:
    test:
        runs-on: [self-hosted]
        defaults:
          run:
            working-directory: /home/runner/_work/aws-three-tier-archicteture/aws-three-tier-archicteture
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Terraform Init
              run: terraform init
            - name: Terraform Plan
              run: terraform plan
            - name: Print Hello World
              run: echo "Esse foi o terraform plan"
